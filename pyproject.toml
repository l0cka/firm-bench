[project]
name = "firm-bench"
version = "0.1.0"
description = "Portable practice-area legal AI eval packs (NSW estate planning v0)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "l0cka" }]
dependencies = [
  "pydantic>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
firm-bench = "firm_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firm_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
